<!DOCTYPE html>
<script src="include.js"></script>
<script>
test(() => {
    const probe = document.createElement('div');
    probe.id = 'probe';
    probe.style.color = 'rgb(1, 2, 3)';
    document.body.append(probe);
    const color = () => getComputedStyle(probe).color;
    const initial = location.href;
    const sections = [{
        conditions: [{type: 'url', value: initial + '#styled'}],
        css: '#probe { color: rgb(4, 5, 6) !important }'
    }];
    println('install: ' + internals.setDerpbirdUserStyles(JSON.stringify(sections)));
    println('outside: ' + color());
    history.replaceState(null, '', '#styled');
    println('inside: ' + color());
    history.replaceState(null, '', '#other');
    println('left: ' + color());
    history.replaceState(null, '', '#styled');
    println('returned: ' + color());
    println('invalid: ' + internals.setDerpbirdUserStyles('[{"css":"body{}"}]'));
    println('after invalid: ' + color());
    println('remove: ' + internals.setDerpbirdUserStyles('[]'));
    println('removed: ' + color());
    internals.setDerpbirdUserStyles(JSON.stringify([
        { conditions: [], css: '#probe { color: rgb(8, 9, 10) !important }' },
        { conditions: [{type: 'url', value: initial + '#override'}], css: '#probe { color: rgb(11, 12, 13) !important }' }
    ]));
    println('unconditional: ' + color());
    for (let i = 0; i < 30; i++) history.replaceState(null, '', '#unchanged-' + i);
    println('unchanged scopes: ' + color());
    history.replaceState(null, '', '#override');
    println('override entered: ' + color());
    history.replaceState(null, '', '#outside');
    println('override left: ' + color());
    internals.setDerpbirdUserStyles(JSON.stringify([{ conditions: [], css: '#probe { color: rgb(14, 15, 16) !important }' }]));
    println('registry changed: ' + color());
});
</script>
