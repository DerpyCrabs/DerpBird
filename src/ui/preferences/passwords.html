<header class="tool-head">
  <button class="tool-back pref-icon-button" hidden></button>
  <h1 id="tool-heading"></h1>
  <div class="tool-actions" data-view="library">
    <button data-do="new" class="pref-button primary">Add password</button>
  </div>
  <button class="tool-close pref-icon-button" aria-label="Close library">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 6 12 12M18 6 6 18" />
    </svg>
  </button>
</header>
<div class="pref-scroll-body">
  <section data-view="library">
    <input
      class="pref-input"
      type="search"
      aria-label="Search passwords"
      placeholder="Search passwords"
    />
    <div class="tool-items"></div>
    <p class="no-results"></p>
    <details class="credential-exceptions tool-options">
      <summary></summary>
      <div class="exception-list"></div>
    </details>
  </section>
  <section data-view="edit" hidden>
    <button class="pref-button" data-do="capture">Save from tab</button>
    <div class="password-fields">
      <label>
        Site
        <input
          name="origin"
          maxlength="2048"
          autocomplete="off"
          spellcheck="false"
          class="pref-input"
          placeholder="https://example.com"
        />
      </label>
      <label>
        Username
        <input
          name="username"
          maxlength="1024"
          class="pref-input"
          autocomplete="off"
        />
      </label>
      <label>
        <span class="password-label"></span>
        <input
          name="password"
          maxlength="65536"
          spellcheck="false"
          type="password"
          class="pref-input"
          autocomplete="new-password"
        />
      </label>
      <div class="tool-actions">
        <button data-do="reveal" class="pref-button"></button>
        <button data-do="copy" class="pref-button">Copy</button>
        <button data-do="fill" class="pref-button">Fill login</button>
        <button data-do="generate" class="pref-button">Generate</button>
      </div>
    </div>
    <div class="tool-remove" hidden>
      <strong>Delete this password?</strong>
      <button data-do="keep" class="pref-button">Keep</button>
      <button data-do="remove" class="pref-button">Delete permanently</button>
    </div>
  </section>
  <section data-view="capture" aria-label="Save login confirmation" hidden>
    <strong class="capture-site"></strong>
    <p class="capture-user"></p>
    <div class="tool-actions">
      <button data-do="save-capture" class="pref-button primary">
        Save new login
      </button>
      <span class="capture-targets"></span>
      <button data-do="cancel-capture" class="pref-button">Don’t save</button>
      <button data-do="never" class="pref-button">Never for this site</button>
    </div>
  </section>
  <button class="pref-button" data-do="reload" hidden>Reload</button>
  <p class="tool-error" role="alert"></p>
</div>
<footer class="tool-editor-actions">
  <button class="pref-button ghost" data-do="delete">Delete…</button>
  <span class="tool-state" role="status"></span>
  <button class="pref-button primary" data-do="save">Save</button>
</footer>
<dialog
  class="pref-dialog leave-confirm"
  aria-labelledby="discard-title"
  hidden
>
  <strong id="discard-title">Discard unsaved changes?</strong>
  <footer>
    <button class="pref-button" data-do="stay">Keep editing</button>
    <button class="pref-button" data-do="leave">Discard changes</button>
  </footer>
</dialog>
